<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>&gt;_ MainCipher — Classic Cipher Toolkit</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>(function(){try{var t=localStorage.getItem('cc-theme');if(!t){t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div>
      <h1><span aria-hidden="true" class="prompt">&gt;_</span> MainCipher</h1>
      <p class="sub">Classical ciphers, text or binary. Pick one and run it.</p>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark theme">
      <svg class="ti ti-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ti ti-moon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="none" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="ti-label" id="ti-label">Dark</span>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <form id="form" autocomplete="off">

      <div class="frow">
        <span class="flabel" id="lbl-tipe">Input type:</span>
        <div class="fcontrol radio-row" role="radiogroup" aria-labelledby="lbl-tipe">
          <label class="opt"><input type="radio" name="input_type" value="teks" checked><span>Text</span></label>
          <label class="opt"><input type="radio" name="input_type" value="file"><span>File</span></label>
        </div>
      </div>

      <div class="frow" id="panel-teks">
        <label class="flabel" for="text">Message (text):</label>
        <div class="fcontrol">
          <textarea id="text" placeholder="Type your message here — characters outside the alphabet are ignored"></textarea>
        </div>
      </div>

      <div class="frow" id="panel-file" hidden>
        <label class="flabel" for="file">File:</label>
        <div class="fcontrol">
          <input type="file" id="file">
          <p class="hint">Every byte of the file (including the header) is encrypted. Output is a .dat file that stores the original name — restored automatically on decryption.</p>
        </div>
      </div>

      <div class="frow">
        <label class="flabel" for="cipher">Cipher:</label>
        <div class="fcontrol">
          <select id="cipher">
            <option value="shift">Shift Cipher</option>
            <option value="substitution">Substitution Cipher</option>
            <option value="affine">Affine Cipher</option>
            <option value="vigenere">Vigenere Cipher</option>
            <option value="playfair">Playfair Cipher</option>
            <option value="hill">Hill Cipher</option>
            <option value="permutation">Permutation Cipher</option>
            <option value="otp">One-Time Pad</option>
          </select>
        </div>
      </div>

      <div class="frow">
        <label class="flabel" for="key">Key:</label>
        <div class="fcontrol">
          <input id="key" spellcheck="false">
          <p class="hint" id="hint"></p>
          <div id="otp-key" hidden>
            <label class="sublabel" for="keyfile">OTP key file (text file containing random letters):</label>
            <input type="file" id="keyfile" accept=".txt">
            <button type="button" class="btn ghost small" id="genkey">Generate 50,000 random-letter key</button>
          </div>
        </div>
      </div>

      <div class="frow" id="fmt-card">
        <span class="flabel" id="lbl-fmt">Ciphertext format:</span>
        <div class="fcontrol radio-row" role="radiogroup" aria-labelledby="lbl-fmt">
          <label class="opt"><input type="radio" name="group" value="0" checked><span>No spaces</span></label>
          <label class="opt"><input type="radio" name="group" value="5"><span>Groups of 5 letters</span></label>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="btn-enc">Encrypt!</button>
        <button type="button" class="btn danger" id="btn-dec">Decrypt!</button>
        <span class="err" id="err" role="alert"></span>
      </div>

    </form>
  </section>

  <section class="panel results" id="results" hidden aria-live="polite">
    <div class="grid-2" id="grid-teks">
      <div>
        <div class="out-head">
          <label for="out-plain">Plaintext</label>
          <button type="button" class="btn ghost small" id="save-plain">Save…</button>
        </div>
        <textarea id="out-plain" readonly></textarea>
      </div>
      <div>
        <div class="out-head">
          <label for="out-cipher">Ciphertext</label>
          <button type="button" class="btn ghost small" id="save-cipher">Save…</button>
        </div>
        <textarea id="out-cipher" readonly></textarea>
      </div>
    </div>
    <div id="grid-file" hidden>
      <p class="hasil-file" id="hasil-file"></p>
      <button type="button" class="btn primary" id="unduh-file">Download file</button>
    </div>
    <p class="hint" id="dl-info"></p>
  </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
