<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KriptaTool — Classic Ciphers Suite</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="navbar">
  <div class="container">
    <div class="nav-brand">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><path d="M8 11l2-2 2 2"/><path d="M12 9v6"/><path d="M16 11l-2-2-2 2"/></svg>
      <span class="brand-text">Kripta<span class="accent">Tool</span></span>
      <span style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:8px;border-left:1px solid var(--card-border);padding-left:8px">Classic Ciphers</span>
    </div>
    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">Dokumentasi</a>
      <a href="#">Tentang</a>
    </nav>
  </div>
</header>

<main class="pipeline">
  
  <!-- INPUT SECTION -->
  <section class="card" id="input-card">
    <div class="card-header">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      </div>
      <h2 class="card-title">Plaintext — Input</h2>
      <div class="mode-switch" role="radiogroup">
        <label class="switch-label">
          <input type="radio" name="input_type" value="text" checked>
          <span>Teks</span>
        </label>
        <label class="switch-label">
          <input type="radio" name="input_type" value="file">
          <span>File</span>
        </label>
      </div>
    </div>
    <div class="card-body">
      <textarea id="plaintext" placeholder="Ketik atau paste pesan di sini (A-Z saja)..."></textarea>
    </div>
    <div class="card-body" id="file-input" hidden>
      <div class="file-dropzone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <input type="file" id="input-file">
        <span id="file-name" class="file-name">Drag & drop file di sini atau klik</span>
      </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn-link" id="btn-clear-in">Bersihkan</button>
      <button type="button" class="btn-secondary" id="btn-save-plain">Simpan</button>
    </div>
  </section>

  <!-- CONNECTOR -->
  <div class="pipeline-arrow" aria-hidden="true">
    <svg viewBox="0 0 40 40" width="40" height="40">
      <path class="arrow-line" d="M10 20h20" stroke="currentColor"/>
      <path class="arrow-head" d="M26 14l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
  </div>

  <!-- CIPHER SECTION -->
  <section class="card" id="cipher-card">
    <div class="card-header">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2 class="card-title">Transformasi</h2>
      <div class="action-buttons">
        <button type="button" class="btn-action active" id="btn-enc">Encrypt</button>
        <button type="button" class="btn-action" id="btn-dec">Decrypt</button>
        <!-- legacy ids for compat: btn-encode/btn-decode kept as aliases via JS -->
        <span hidden id="btn-encode"></span><span hidden id="btn-decode"></span>
      </div>
    </div>
    <div class="card-body">
      <div class="form-group">
        <label class="form-label">Cipher Algorithm</label>
        <select id="cipher-select">
          <option value="shift">Shift Cipher (Caesar)</option>
          <option value="substitution">Substitution Cipher</option>
          <option value="affine">Affine Cipher</option>
          <option value="vigenere">Vigenère Cipher</option>
          <option value="hill">Hill Cipher</option>
          <option value="permutation">Permutation Cipher</option>
          <option value="otp">One-Time Pad</option>
        </select>
      </div>
      <div class="form-group" id="key-group">
        <label class="form-label" id="key-label">Kunci</label>
        <input type="text" id="cipher-key" placeholder="Masukkan kunci..." spellcheck="false">
        <p class="hint-text" id="key-hint"></p>
      </div>
      <div class="form-group" id="otp-group" hidden>
        <label class="form-label">File Kunci OTP</label>
        <div class="otp-key-row">
          <input type="file" id="otp-keyfile" accept=".txt">
          <button type="button" class="btn-link" id="btn-genkey">Generate Random Key</button>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <span class="status-text" id="cipher-status"></span>
      <button type="button" class="btn-primary" id="btn-transform">Proses</button>
    </div>
  </section>

  <!-- CONNECTOR -->
  <div class="pipeline-arrow" aria-hidden="true">
    <svg viewBox="0 0 40 40" width="40" height="40">
      <path class="arrow-line" d="M10 20h20" stroke="currentColor"/>
      <path class="arrow-head" d="M26 14l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
  </div>

  <!-- OUTPUT SECTION -->
  <section class="card" id="output-card">
    <div class="card-header">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      </div>
      <h2 class="card-title">Ciphertext — Output</h2>
      <div class="format-switch" role="radiogroup">
        <label class="switch-label">
          <input type="radio" name="output-format" value="compact" checked>
          <span>Rapat</span>
        </label>
        <label class="switch-label">
          <input type="radio" name="output-format" value="grouped">
          <span>Group 5</span>
        </label>
      </div>
    </div>
    <div class="card-body">
      <textarea id="ciphertext" readonly placeholder="Hasil transformasi akan muncul di sini..."></textarea>
    </div>
    <div class="card-body" id="file-output" hidden>
      <div class="file-info">
        <span id="output-filename" class="filename-text">output.dat</span>
        <button type="button" class="btn-link" id="btn-clear-file">Clear</button>
      </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn-link" id="btn-clear-out">Bersihkan</button>
      <button type="button" class="btn-secondary" id="btn-save-out">Unduh File</button>
    </div>
  </section>

</main>

<div class="footer">
  <div class="container">
    <p>Built with Flask & Python | Kriptografi - Kelompok 3 — Classic Ciphers</p>
  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
